<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Segoe UI,Arial,sans-serif;color:#1f2937;background:#f3f5f9;display:flex;min-height:100vh}
#side{width:220px;background:#12305c;color:#fff;padding:18px 0;flex-shrink:0}#side h1{font-size:19px;margin:0 18px}#side small{display:block;margin:2px 18px 14px;opacity:.7}
nav a{display:block;padding:10px 18px;cursor:pointer}nav a:hover,nav a.on{background:#1e4a8a}
main{flex:1;padding:22px;min-width:0}h2{margin-top:0;color:#12305c}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px #0002}.card span{display:block;color:#6b7280}.card b{font-size:30px}.card.warn b{color:#c2410c}
button{padding:9px 16px;border:1px solid #9aa7bd;background:#fff;border-radius:6px;cursor:pointer;font:inherit;margin:3px}button.pri{background:#1e4a8a;color:#fff;border-color:#1e4a8a}button:disabled{opacity:.5;cursor:not-allowed}
#drop{border:2px dashed #9aa7bd;background:#fff;border-radius:12px;padding:30px;text-align:center}#drop.over{background:#e8f0fe;border-color:#1e4a8a}
textarea,input[type=text]{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.pane{background:#fff;border-radius:10px;padding:14px;min-width:0}
#orig iframe,#orig img{width:100%;height:70vh;border:1px solid #ddd;object-fit:contain}#orig pre{white-space:pre-wrap;max-height:70vh;overflow:auto}
.f{margin-bottom:9px}.f label{font-size:13px;color:#6b7280;display:block}
.badge{font-weight:700;padding:6px 0}.ok{color:#15803d}.bad{color:#c2410c}.msg{background:#fff7ed;border-left:4px solid #c2410c;padding:6px 10px;margin:6px 0}.err{background:#fef2f2;border-color:#b91c1c}
.actions{margin-top:12px;text-align:right}#dup{background:#fffbeb;border:1px solid #f59e0b;padding:10px;border-radius:6px;margin-top:8px}
.tw{overflow:auto;background:#fff;border-radius:10px}table{border-collapse:collapse;width:100%}th,td{padding:7px 10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}th{background:#e8eef7}
#toast{position:fixed;bottom:20px;right:20px;background:#12305c;color:#fff;padding:12px 18px;border-radius:8px}
@media(max-width:800px){body{flex-direction:column}#side{width:100%}nav{display:flex;overflow-x:auto}nav a{white-space:nowrap}.split{grid-template-columns:1fr}}
</style>
